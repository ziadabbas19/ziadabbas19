<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img"><title>Kickboxing — controlled side kick</title><style>.leg{transform-origin:42px 49px;animation:kick 4s cubic-bezier(.4,0,.2,1) infinite}.body{transform-origin:42px 49px;animation:lean 4s ease-in-out infinite}.trail{animation:trail 4s ease-in-out infinite}@keyframes kick{0%,22%,80%,100%{transform:rotate(0)}42%,52%{transform:rotate(-65deg)}}@keyframes lean{0%,22%,80%,100%{transform:rotate(0)}42%,52%{transform:rotate(-13deg)}}@keyframes trail{0%,32%,65%,100%{opacity:0}48%{opacity:.9}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8ddff"/><stop offset="1" stop-color="#4c87e8"/></linearGradient><radialGradient id="bg"><stop stop-color="#172b48"/><stop offset="1" stop-color="#101722"/></radialGradient></defs>
